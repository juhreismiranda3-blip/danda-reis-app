:root{--bg:#FCFAFB;--surface:#fff;--ink:#3E2E3A;--soft:#8A7F88;--muted:#B3A8B0;
--pink:#B98CAE;--pinkT:#8C5A82;--pinkL:#F3E6F0;--lilacL:#F1EEF7;--lilacT:#7A6FA0;--border:#EEE2EC;
--okbg:#E9F3EA;--okt:#3B7A4A;--warnbg:#FDF3D8;--warnt:#8A6D1F;--dangbg:#FBE7E7;--dangt:#A34848;}
@media (prefers-color-scheme:dark){:root{--bg:#171218;--surface:#211a20;--ink:#efe6ec;--soft:#b3a6b0;--muted:#8a7d87;--border:#33283a;--pinkL:#3a2c37;--lilacL:#2b2740;}}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;}
.modebar{position:sticky;top:0;z-index:20;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;
padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--border);font-size:12px;}
.modebar b{color:var(--pinkT);}
.modebar button,.modebar select{font-family:inherit;font-size:12px;border:1px solid var(--border);background:var(--bg);color:var(--ink);
border-radius:99px;padding:6px 12px;cursor:pointer;}
.modebar button.active{background:var(--pink);color:#fff;border-color:var(--pink);}
.modebar .reset{color:var(--dangt);border-color:var(--dangbg);}
#app{max-width:440px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.d-appbar{display:flex;align-items:center;gap:8px;padding:16px 18px 10px;}
.d-appbar .d-title{font-size:18px;font-weight:600;flex:1;}
.bell{position:relative;background:none;border:none;font-size:21px;cursor:pointer;padding:2px 2px;line-height:1;}
.bell .badge{position:absolute;top:-3px;right:-4px;background:var(--dangt);color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.d-back{border:none;background:none;color:var(--pinkT);font-size:26px;line-height:1;cursor:pointer;padding:0 4px 0 0;}
.d-content{flex:1;min-height:0;padding:6px 16px 20px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.d-hero{background:var(--pinkL);border-radius:16px;padding:18px;font-size:17px;font-weight:600;color:var(--ink);}
.d-section{font-size:12px;color:var(--soft);margin-top:6px;}
.d-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.d-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;}
.d-row{flex-direction:row;align-items:center;gap:12px;}
.d-ic{width:40px;height:40px;border-radius:50%;background:var(--pinkL);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;}
.d-grow{flex:1;min-width:0;}
.d-b{font-size:14.5px;font-weight:600;}
.d-s{font-size:12px;color:var(--soft);margin-top:2px;}
.d-s2{font-size:13px;margin-top:3px;}
.d-cap{text-align:center;}.d-cap b{font-size:16px;}.d-cap span{display:block;font-size:10px;color:var(--muted);}
.d-cta{width:100%;border:none;background:var(--pink);color:#fff;font-family:inherit;font-size:14.5px;font-weight:600;padding:14px;border-radius:12px;cursor:pointer;}
.d-cta.ghost{background:transparent;color:var(--pinkT);border:1.5px solid var(--pink);}
.d-cta.danger{color:var(--dangt);border-color:var(--dangbg);}
.d-cta.small{padding:11px;font-size:13px;}
.d-input{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;}
textarea.d-input{resize:vertical;}
.d-big{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;}
.d-big .d-ic{background:var(--lilacL);}
.d-stat{background:var(--lilacL);border-radius:14px;padding:14px;}
.d-stat .v{font-size:22px;font-weight:700;}.d-stat .l{font-size:11px;color:var(--lilacT);font-weight:500;margin-top:3px;}
.d-tint{background:var(--pinkL);border-radius:16px;padding:16px;}
.addcard{border-radius:14px;padding:14px;border:1px solid transparent;}
.addcard.ex{background:var(--lilacL);border-color:var(--lilacT);}
.addcard.bo{background:var(--okbg);border-color:var(--okt);}
.ac-tag{font-size:10.5px;font-weight:700;letter-spacing:.4px;}
.addcard.ex .ac-tag{color:var(--lilacT);}
.addcard.bo .ac-tag{color:var(--okt);}
.ac-when{font-size:15px;font-weight:600;color:var(--ink);margin-top:4px;}
.d-eyebrow{font-size:11px;font-weight:600;letter-spacing:.6px;color:var(--pinkT);}
.d-actions{display:flex;gap:10px;}
.d-btn{flex:1;border:none;border-radius:10px;padding:11px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;}
.d-btn.ok{background:var(--okbg);color:var(--okt);}
.d-btn.no{background:var(--dangbg);color:var(--dangt);}
.d-btn.line{background:transparent;color:var(--pinkT);border:1.5px solid var(--pink);}
.pill{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:99px;}
.pill.ok{background:var(--okbg);color:var(--okt);}.pill.warn{background:var(--warnbg);color:var(--warnt);}.pill.dang{background:var(--dangbg);color:var(--dangt);}
.pill.lilac{background:var(--lilacL);color:var(--lilacT);}
.chip{border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center;cursor:pointer;background:var(--surface);flex:1;font-size:12.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:4px;}
.chip.sel{background:var(--pink);color:#fff;border-color:var(--pink);}
.chiprow{display:flex;gap:8px;}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.dot.ok{background:var(--okt);}.dot.no{background:var(--dangt);}
.legend{display:flex;gap:14px;font-size:11px;color:var(--soft);}
.legend span{display:flex;align-items:center;gap:5px;}
.periodrow{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:12px;padding:13px 14px;background:var(--surface);cursor:pointer;}
.periodrow.sel{background:var(--pinkL);border-color:var(--pink);}
.periodrow.off{opacity:.55;cursor:default;}
.d-nav{display:flex;justify-content:space-around;border-top:1px solid var(--border);background:var(--surface);padding:8px 4px calc(8px + env(safe-area-inset-bottom));}
.d-nav .it{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);cursor:pointer;background:none;border:none;font-family:inherit;}
.d-nav .it .e{font-size:19px;filter:grayscale(1);opacity:.7;}
.d-nav .it.active{color:var(--pinkT);font-weight:600;}
.d-nav .it.active .e{filter:none;opacity:1;}
.badge{width:54px;height:54px;border-radius:12px;background:var(--pinkL);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--pinkT);flex:none;}
.badge .d{font-size:18px;font-weight:700;line-height:1;}.badge .m{font-size:10px;font-weight:600;}
.empty{text-align:center;color:var(--soft);font-size:13px;padding:30px 10px;}
.d-linkbtn{background:none;border:none;color:var(--pinkT);font-family:inherit;font-size:11px;cursor:pointer;padding:2px 0;}
.payacts{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.wabtn{display:block;text-align:center;text-decoration:none;background:#25D366;color:#fff;font-size:13px;font-weight:600;padding:11px;border-radius:12px;}
.valpill{display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right;flex:none;}
.stepbox{display:flex;align-items:center;gap:8px;flex:none;}
.stepbox button{width:32px;height:32px;border-radius:8px;border:none;background:var(--pinkL);color:var(--pinkT);font-size:18px;font-weight:600;cursor:pointer;}
.stepbox span{font-size:13.5px;font-weight:600;color:var(--ink);min-width:46px;text-align:center;}
.receipt{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;}
.rc-head{display:flex;align-items:center;gap:10px;}
.rc-logo{width:38px;height:38px;border-radius:50%;background:var(--pinkL);display:flex;align-items:center;justify-content:center;font-size:18px;}
.rc-name{font-size:15px;font-weight:600;}.rc-sub{font-size:9px;letter-spacing:1.5px;color:var(--pinkT);}
.rc-tag{margin-left:auto;font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:600;}
.dashed{border-top:1px dashed var(--border);margin:14px 0;}
.rc-line{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;}
.rc-total{display:flex;justify-content:space-between;align-items:center;}
.rc-total .v{font-size:18px;font-weight:800;}
.stamp{display:inline-flex;flex-direction:column;align-items:center;border:2.2px solid var(--okt);border-radius:10px;padding:6px 14px;transform:rotate(-7deg);}
.stamp b{font-size:19px;font-weight:800;letter-spacing:3px;color:var(--okt);}.stamp span{font-size:10px;color:var(--okt);}
.banner{background:var(--lilacL);border-radius:14px;padding:13px 14px;display:flex;gap:10px;align-items:center;color:var(--lilacT);font-size:13px;font-weight:600;cursor:pointer;}
.warn{background:var(--warnbg);color:var(--warnt);border-radius:12px;padding:12px;font-size:12.5px;line-height:1.4;}
.welcome{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:44px 28px;background:linear-gradient(180deg,var(--lilacL),var(--bg) 55%,var(--pinkL));}
.w-logo{width:100px;height:100px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 14px 32px -8px rgba(185,140,174,.5);}
.w-name{font-size:30px;font-weight:600;margin-top:24px;}
.w-sub{font-size:11px;font-weight:500;letter-spacing:3px;color:var(--pinkT);margin-top:6px;}
.w-tag{font-size:14px;color:var(--soft);margin-top:16px;line-height:1.55;}
.w-card{background:rgba(255,255,255,.7);border:1px solid var(--border);border-radius:16px;padding:6px 16px;margin-top:26px;width:100%;max-width:340px;}
.w-li{display:flex;align-items:center;gap:12px;padding:12px 0;text-align:left;}
.w-li+.w-li{border-top:1px solid var(--border);}
.w-li .e{width:40px;height:40px;border-radius:50%;background:var(--pinkL);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}
.w-li .t{font-size:13.5px;font-weight:500;}.w-li .d{font-size:11.5px;color:var(--soft);}
.w-btns{width:100%;max-width:340px;margin-top:26px;display:flex;flex-direction:column;gap:10px;}
.w-help{font-size:12px;color:var(--muted);margin-top:14px;}
.d-modal{position:fixed;inset:0;background:rgba(40,20,35,.45);display:flex;align-items:center;justify-content:center;z-index:70;padding:24px;}
.d-dialog{background:var(--surface);border-radius:18px;padding:22px;max-width:340px;width:100%;}
.d-dmsg{font-size:14.5px;margin-bottom:18px;line-height:1.5;}
.d-dacts{display:flex;gap:10px;}
#push{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;z-index:80;transform:translateY(-140%);transition:transform .35s ease;padding:8px;pointer-events:none;}
#push.show{transform:translateY(0);}
.pushcard{background:rgba(255,255,255,.97);border:1px solid var(--border);border-radius:16px;padding:12px 14px;max-width:400px;width:100%;box-shadow:0 14px 34px -10px rgba(0,0,0,.4);pointer-events:auto;cursor:pointer;}
.pc-hint{font-size:10.5px;color:var(--pinkT);font-weight:600;margin-top:6px;}
.pc-h{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.pc-ic{width:22px;height:22px;border-radius:6px;background:linear-gradient(145deg,#C79BBB,#8E7FB2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;}
.pc-app{font-size:10.5px;font-weight:600;letter-spacing:.5px;color:#6b5c66;flex:1;}
.pc-t{font-size:10.5px;color:#9a8b96;}
.pc-title{font-size:14px;font-weight:600;color:#2b2130;}
.pc-body{font-size:13px;color:#4a3d46;margin-top:2px;line-height:1.35;}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(16px);background:#3E2E3A;color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:500;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:82vw;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.w-logo img,.rc-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}</style>
</head>

<div id="app"></div>
<div id="toast"></div>

const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DOW={segunda:1,terca:2,quarta:3,quinta:4};
const DIA_LABEL={segunda:'Segunda',terca:'Terça',quarta:'Quarta',quinta:'Quinta'};
const PER_LABEL={manha:'Manhã',tarde:'Tarde',noite:'Noite'};
function valorMensal(){return (S&&S.config&&S.config.mensalidade!=null)?S.config.mensalidade:180;}
function valorExtraCfg(){return (S&&S.config&&S.config.valorExtra!=null)?S.config.valorExtra:40;}
const uid=()=>Math.random().toString(36).slice(2,9);
function esc(s){return (s==null?'':(''+s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function money(v){return 'R$ '+(v||0).toFixed(2).replace('.',',');}
function soDigitos(s){return (''+(s||'')).replace(/\D/g,'');}
function waLink(tel,msg){var d=soDigitos(tel);if(!d)return null;if(d.length<=11)d='55'+d;return 'https://wa.me/'+d+'?text='+encodeURIComponent(msg);}
function D(s){return new Date(s);}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
function dow(s){return cap(new Intl.DateTimeFormat('pt-BR',{weekday:'long'}).format(D(s)));}
function dm(s){const d=D(s);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');}
function ddmmyyyy(s){return dm(s)+'/'+D(s).getFullYear();}
function mesNome(d){return MESES[d.getMonth()];}
function nextDate(weekday,i){const d=new Date();d.setHours(0,0,0,0);let add=(weekday-d.getDay()+7)%7;d.setDate(d.getDate()+add+i*7);return d;}
function proxDiasUteis(n){const out=[];let d=new Date();d.setHours(0,0,0,0);while(out.length<n){d.setDate(d.getDate()+1);const w=d.getDay();if(w>=1&&w<=4)out.push(new Date(d));}return out;}

let S,V;

function gerarAulas(a){const t=S.turmas.find(x=>x.id===a.turmaId);if(!t)return;for(let i=0;i<4;i++){const d=nextDate(DOW[t.dia],i);S.aulas.push({id:uid(),alunaId:a.id,turmaId:t.id,data:d.toISOString(),periodo:t.periodo,hora:t.inicio,status:'agendada',confirmacao:'pendente',origem:'pacote'});}}
function diaVenc(){return (S&&S.config&&S.config.diaVencimento)||10;}
function novaMensalidade(alunaId,base){const now=new Date();var _al=S.alunas.find(function(x){return x.id===alunaId;});var d=(_al&&_al.diaVenc)||diaVenc();let venc=new Date(now.getFullYear(),now.getMonth(),d);if(venc<now)venc=new Date(now.getFullYear(),now.getMonth()+1,d);return {id:uid(),alunaId,base:base,extras:0,qtdExtras:0,venc:venc.toISOString(),pagoEm:null,desc:'Mensalidade de '+mesNome(venc)};}

var DIAS_SEMANA=['segunda','terca','quarta','quinta'];
var PERIODOS=['manha','tarde','noite'];
var HORARIOS={manha:['09:00','11:00'],tarde:['14:00','16:00'],noite:['19:00','21:00']};
function turmasPadrao(){var out=[];DIAS_SEMANA.forEach(function(d){PERIODOS.forEach(function(p){out.push({id:'t_'+d+'_'+p,nome:DIA_LABEL[d]+' '+PER_LABEL[p],dia:d,periodo:p,inicio:HORARIOS[p][0],fim:HORARIOS[p][1],cap:6});});});return out;}
function seed(){
  S={turmas:turmasPadrao(),alunas:[],aulas:[],pagamentos:[],avisos:[],ofertas:[],config:{diaVencimento:10,professoraEmail:'',mensalidade:180,valorExtra:40}};
  return S;
}
function gerarTurmasPadrao(){var add=0;turmasPadrao().forEach(function(t){var existe=S.turmas.some(function(x){return x.dia===t.dia&&x.periodo===t.periodo;});if(!existe){t.id=uid();S.turmas.push(t);add++;}});if(add>0){save();render();toast(add+' turma'+(add>1?'s':'')+' criada'+(add>1?'s':'')+' 💗');}else{toast('Todas as turmas padrão já existem.');}}
function setDiaVenc(delta){var d=(diaVenc()+delta);if(d<1)d=1;if(d>28)d=28;S.config.diaVencimento=d;S.pagamentos.forEach(function(p){if(!p.pagoEm){var al=S.alunas.find(function(x){return x.id===p.alunaId;});if(al&&al.diaVenc)return;var v=D(p.venc);p.venc=new Date(v.getFullYear(),v.getMonth(),d).toISOString();}});save();render();toast('Vencimento padrão: dia '+d);}

function pendMensalidade(alunaId){return S.pagamentos.filter(p=>p.alunaId===alunaId&&!p.pagoEm).sort((a,b)=>D(a.venc)-D(b.venc))[0];}
function total(p){return (p.base||0)+(p.extras||0);}
function statusPag(p){if(p.pagoEm)return'pago';return D(p.venc)<new Date()?'atrasado':'pendente';}
function addExtra(alunaId){let p=pendMensalidade(alunaId);if(!p){p=novaMensalidade(alunaId,0);p.desc='Aulas extras';S.pagamentos.push(p);}p.extras+=valorExtraCfg();p.qtdExtras+=1;}
/* Aula adicional: se a aluna tem reposição (bônus), usa 1 e NÃO cobra;
   só quando acaba o bônus é que vira aula extra somada à mensalidade. */
function usarCreditoOuCobrar(al){if((al.reposicao||0)>0){al.reposicao-=1;return 'reposicao';}addExtra(al.id);return 'extra';}
/* ---- disponibilidade de vaga ---- */
function sameDay(a,b){const x=D(a),y=D(b);return x.getFullYear()===y.getFullYear()&&x.getMonth()===y.getMonth()&&x.getDate()===y.getDate();}
function turmasDe(weekday,periodo){return S.turmas.filter(t=>DOW[t.dia]===weekday&&t.periodo===periodo);}
function ocupadas(turmaId,iso){return S.aulas.filter(a=>a.turmaId===turmaId&&a.status==='agendada'&&sameDay(a.data,iso)).length;}
function vagasNoPeriodo(iso,periodo){const wd=D(iso).getDay();let v=0;turmasDe(wd,periodo).forEach(t=>{v+=Math.max(0,t.cap-ocupadas(t.id,iso));});return v;}
function diaTemVaga(iso){return ['manha','tarde','noite'].some(p=>vagasNoPeriodo(iso,p)>0);}
function turmaComVaga(iso,periodo){const ts=turmasDe(D(iso).getDay(),periodo);for(const t of ts){if(ocupadas(t.id,iso)<t.cap)return t;}return null;}
function alunaTemAulaNo(alunaId,iso,periodo,exceptId){return S.aulas.some(a=>a.alunaId===alunaId&&a.status==='agendada'&&a.periodo===periodo&&sameDay(a.data,iso)&&a.id!==exceptId);}
function diaTemAula(iso){const wd=D(iso).getDay();return S.turmas.some(t=>DOW[t.dia]===wd);}
function aulaDateTime(a){const d=D(a.data);if(a.hora){const p=(''+a.hora).split(':');d.setHours(parseInt(p[0])||0,parseInt(p[1])||0,0,0);}return d;}
function aulaJaPassou(a){return aulaDateTime(a)<=new Date();}
function proxDiasComAula(n){const out=[];let d=new Date();d.setHours(0,0,0,0);let g=0;while(out.length<n&&g<70){d.setDate(d.getDate()+1);g++;if(diaTemAula(d.toISOString()))out.push(new Date(d));}return out;}
function diasDaSemanaDe(iso){const base=D(iso);const monday=new Date(base);monday.setHours(0,0,0,0);monday.setDate(base.getDate()-((base.getDay()+6)%7));const hoje=new Date();hoje.setHours(0,0,0,0);const out=[];for(let i=0;i<4;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);if(!sameDay(d,iso)&&d>=hoje)out.push(d);}return out;}

function slugNome(nome){return (nome||'').split(' ')[0].normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');}

function scrReposicao(){
  const a=curAluna();const n=a.reposicao||0;
  let h='<div class="d-card" style="background:var(--okbg);border:none">'+
    '<div class="d-b" style="color:var(--okt)">🎁 Aula de reposição — sem custo</div>'+
    '<div class="d-s2">Aulas que você agenda sem custo (por aviso antecipado ou liberadas pela professora). Você tem <b>'+n+'</b> disponível'+(n===1?'':'is')+'.</div></div>';
  if(n<=0)return h+empty('Você não tem reposição disponível agora.');
  h+='<div class="d-section">Escolha o dia</div>'+diaChips()+
     '<div class="d-section">Escolha o período</div>'+perChips()+
     '<button class="d-cta" onclick="agendarReposicao()">Agendar reposição (sem custo)</button>';
  return h;
}
function scrExtra(){
  const a=curAluna();const temRepo=(a.reposicao||0)>0;
  const topo=temRepo
    ? '<div class="d-card" style="background:var(--okbg);border:none"><div class="d-b" style="color:var(--okt)">🎁 Você tem '+a.reposicao+' aula'+(a.reposicao>1?'s':'')+' de reposição</div><div class="d-s2">Esta aula será <b>sem custo</b> (usa 1 reposição). Só vira aula extra paga quando os bônus acabarem.</div></div>'
    : '<div class="d-tint" style="display:flex;align-items:center;gap:14px"><div class="d-ic" style="background:#fff">＋</div><div><div class="d-eyebrow">VALOR DA AULA EXTRA</div><div class="d-b" style="font-size:20px">'+money(valorExtraCfg())+'</div></div></div><div class="warn">O valor é somado à sua mensalidade pendente. A vaga é reservada assim que você confirma.</div>';
  return topo+
   '<div class="d-section">Escolha a data</div>'+diaChips()+
   '<div class="d-section">Escolha o período</div>'+perChips()+
   '<button class="d-cta" onclick="reservarExtra()">'+(temRepo?'Reservar (sem custo)':'Reservar aula extra')+'</button>';
}
function scrPagamentos(){
  const a=curAluna();const list=S.pagamentos.filter(p=>p.alunaId===a.id).sort((x,y)=>D(y.venc)-D(x.venc));
  if(!list.length)return empty('Nenhum pagamento ainda.');
  return list.map(p=>{const st=statusPag(p);const pill=st==='pago'?'<span class="pill ok">Pago</span>':st==='atrasado'?'<span class="pill dang">Atrasado</span>':'<span class="pill warn">Pendente</span>';
    return '<div class="d-card d-row" onclick="verRecibo(\''+p.id+'\')"><div class="d-grow"><div style="display:flex;align-items:center;gap:8px"><span class="d-b">'+money(total(p))+'</span>'+pill+'</div><div class="d-s2">'+esc(p.desc)+'</div><div class="d-s">'+(p.pagoEm?'Pago em '+ddmmyyyy(p.pagoEm):'Vence '+ddmmyyyy(p.venc))+'</div>'+(p.qtdExtras>0?'<div class="d-s" style="color:var(--pinkT);font-weight:600">Inclui '+p.qtdExtras+' aula'+(p.qtdExtras>1?'s':'')+' extra'+(p.qtdExtras>1?'s':'')+'</div>':'')+'</div><div style="text-align:center;color:var(--pinkT)">🧾<div style="font-size:9px">recibo</div></div></div>';}).join('');
}
function scrRecibo(){
  const p=S.pagamentos.find(x=>x.id===V.param);if(!p)return empty('Recibo não encontrado.');
  const pago=!!p.pagoEm;const a=curAluna();
  return '<div class="receipt">'+
   '<div class="rc-head"><div class="rc-logo"><img src="'+LOGO+'" alt=""></div><div><div class="rc-name">Danda Reis</div><div class="rc-sub">CORTE E COSTURA</div></div><div class="rc-tag">RECIBO</div></div>'+
   '<div class="dashed"></div>'+
   '<div class="d-s2">'+esc(p.desc)+'</div><div class="d-s">Aluna: '+esc(a.nome)+'</div>'+
   '<div class="rc-line"><span>Mensalidade</span><span>'+money(p.base)+'</span></div>'+
   (p.qtdExtras>0?'<div class="rc-line"><span>Aulas extras ('+p.qtdExtras+')</span><span>'+money(p.extras)+'</span></div>':'')+
   '<div class="dashed"></div>'+
   '<div class="rc-total"><span class="d-b">Total</span><span class="v">'+money(total(p))+'</span></div>'+
   '<div style="display:flex;justify-content:center;margin-top:14px">'+(pago?'<div class="stamp"><b>PAGO</b><span>'+ddmmyyyy(p.pagoEm)+'</span></div>':'<span class="pill warn">Pagamento pendente</span>')+'</div>'+
   '<div class="d-s" style="text-align:center;margin-top:10px">'+(pago?'Vencimento: '+ddmmyyyy(p.venc):'Vence '+ddmmyyyy(p.venc))+'</div>'+
   '</div>';
}
function scrVagas(){
  const a=curAluna();const list=S.ofertas.filter(o=>o.aberta&&o.origem!==a.id);
  let h=(a.reposicao||0)>0
    ? '<div class="warn" style="background:var(--okbg);color:var(--okt)">A primeira que aceitar leva. Você tem reposição — pegar esta vaga será <b>sem custo</b>.</div>'
    : '<div class="warn">A primeira que aceitar leva. Conta como aula extra: '+money(valorExtraCfg())+' somados à mensalidade.</div>';
  if(!list.length)return h+empty('Nenhuma vaga aberta agora.');
  h+=list.map(o=>'<div class="d-card d-row"><div class="d-ic">📅</div><div class="d-grow"><div class="d-b">'+dow(o.data)+', '+dm(o.data)+'</div><div class="d-s">'+(o.hora||'')+' '+PER_LABEL[o.periodo]+'</div></div><button class="d-cta small" style="width:auto;padding:10px 16px" onclick="aceitarVaga(\''+o.id+'\')">Quero</button></div>').join('');
  return h;
}
function scrAlunaAvisos(){
  if(!S.avisos.length)return empty('Nenhum aviso ainda.');
  return S.avisos.slice().reverse().map(v=>'<div class="d-card d-row" style="align-items:flex-start;gap:12px"><div class="d-ic">📣</div><div class="d-grow"><div class="d-b">'+esc(v.titulo)+'</div><div class="d-s2">'+esc(v.msg)+'</div><div class="d-s">'+new Date(v.ts).toLocaleDateString('pt-BR')+' · '+new Date(v.ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'</div></div></div>').join('');
}
function scrPerfil(){
  const a=curAluna();const now=new Date();
  const hist=S.aulas.filter(x=>x.alunaId===a.id&&x.status!=='cancelada'&&D(x.data).getMonth()===now.getMonth()).sort((x,y)=>D(y.data)-D(x.data));
  const pillFor=s=>s==='concluida'?'<span class="pill ok">Concluída</span>':s==='falta'?'<span class="pill dang">Faltou</span>':s==='remarcada'?'<span class="pill warn">Remarcada</span>':'<span class="pill lilac">Agendada</span>';
  return '<div class="d-tint" style="display:flex;align-items:center;gap:14px"><div class="d-ic" style="background:#fff;width:56px;height:56px;font-size:20px">'+a.nome.slice(0,1)+'</div><div><div class="d-b" style="font-size:17px">'+esc(a.nome)+'</div><div class="d-s" style="color:var(--pinkT)">'+esc(a.email)+'</div>'+(a.tel?'<div class="d-s">'+esc(a.tel)+'</div>':'')+'</div></div>'+
   '<div class="d-card d-row"><div class="d-grow"><div class="d-s">Turma fixa</div></div><div class="d-b">'+turmaLabel(a.turmaId)+'</div></div>'+
   '<div class="d-card d-row"><div class="d-grow"><div class="d-s">Aulas por mês</div></div><div class="d-b">'+a.aulasMes+'</div></div>'+
   '<div class="d-section">Histórico do mês</div>'+
   (hist.length?hist.map(x=>'<div class="d-card d-row"><div class="d-grow"><div class="d-b" style="font-size:13.5px">'+dow(x.data)+', '+dm(x.data)+'</div><div class="d-s">'+PER_LABEL[x.periodo]+(x.origem==='extra'?' · Aula extra':x.origem==='reposicao'?' · Reposição':'')+'</div></div>'+pillFor(x.status)+'</div>').join(''):empty('Nada neste mês ainda.'))+'<div class="d-section">Conta</div>'+logoutRow();
}

/* ---------- tela de início ---------- */
function scrInicio(){
  return '<div class="welcome">'+
    '<div class="w-logo"><img src="'+LOGO+'" alt="Danda Reis"></div>'+
    '<div class="w-name">Danda Reis</div>'+
    '<div class="w-sub">CORTE E COSTURA</div>'+
    '<div class="w-tag">Tudo o que você precisa da sua escola<br>de costura, em um só lugar.</div>'+
    '<div class="w-card">'+
      '<div class="w-li"><div class="e">📅</div><div><div class="t">Aulas e remarcações</div><div class="d">Veja sua agenda e remarque com poucos toques.</div></div></div>'+
      '<div class="w-li"><div class="e">💳</div><div><div class="t">Pagamentos</div><div class="d">Acompanhe o que está pago ou pendente.</div></div></div>'+
      '<div class="w-li"><div class="e">📣</div><div><div class="t">Avisos</div><div class="d">Receba os comunicados da professora.</div></div></div>'+
    '</div>'+
    '<div class="w-btns">'+
      '<button class="d-cta" onclick="irLogin(\'aluna\')">Entrar como aluna</button>'+
      '<button class="d-cta ghost" onclick="irLogin(\'prof\')">Entrar como professora</button>'+
    '</div>'+
    '<div class="w-help">Escolha como você entra.</div>'+
  '</div>';
}
function goInicio(){V.signup=false;V.loginRole=null;V.screen='inicio';render();}
function irLogin(role){V.loginRole=role;V.signup=false;V.screen='login';render();}
function toggleSignup(){V.signup=!V.signup;render();}
function setBusy(b){var el=document.getElementById('loginBtn');if(el){el.disabled=b;el.textContent=b?'Aguarde…':(V.signup?'Criar acesso':'Entrar');}}
function fazerLogin(){var e=val('f_email').trim(),s=val('f_senha');if(!e||!s){toast('Digite e-mail e senha');return;}setBusy(true);auth.signInWithEmailAndPassword(e,s).then(afterAuth).catch(function(err){setBusy(false);toast(msgErr(err));});}
function criarConta(){var e=val('f_email').trim(),s=val('f_senha');if(!e||!s){toast('Digite e-mail e senha');return;}if(s.length<6){toast('A senha precisa de 6 caracteres ou mais.');return;}setBusy(true);auth.createUserWithEmailAndPassword(e,s).then(afterAuth).catch(function(err){setBusy(false);toast(msgErr(err));});}
function afterAuth(){var email=emailOf();if(V.loginRole==='prof'){var pe=((S&&S.config&&S.config.professoraEmail)||'').toLowerCase();if(!pe){S.config.professoraEmail=email;save();toast('Acesso da professora criado! ✂️');}else if(pe!==email){toast('Este e-mail não é o da professora.');auth.signOut();return;}}route();}
function scrLogin(){
  var prof=V.loginRole==='prof';var su=!!V.signup;
  return '<div class="welcome" style="justify-content:flex-start;padding-top:14px">'+
    '<div style="width:100%;max-width:360px"><button class="d-back" onclick="goInicio()">‹</button></div>'+
    '<div class="w-logo" style="width:78px;height:78px;margin-top:4px"><img src="'+LOGO+'" alt="Danda Reis"></div>'+
    '<div class="w-name" style="font-size:24px;margin-top:16px">Danda Reis</div>'+
    '<div class="w-sub">CORTE E COSTURA</div>'+
    '<div class="w-btns" style="margin-top:22px">'+
      '<div class="d-card" style="gap:12px">'+
        '<div class="d-b">'+(prof?'Acesso da professora':(su?'Criar seu acesso':'Bem-vinda de volta'))+'</div>'+
        '<div class="d-s" style="margin-top:-4px">'+(su?'Escolha um e-mail e uma senha (mínimo 6 letras/números).':(prof?'Entre para abrir seu painel.':'Entre para ver suas aulas e pagamentos.'))+'</div>'+
        '<input id="f_email" class="d-input" type="email" autocomplete="email" placeholder="E-mail" value="">'+
        '<input id="f_senha" class="d-input" type="password" autocomplete="current-password" placeholder="Senha" value="">'+
        '<button class="d-cta" id="loginBtn" onclick="'+(su?'criarConta()':'fazerLogin()')+'">'+(su?'Criar acesso':'Entrar')+'</button>'+
        '<button class="d-linkbtn" style="font-size:12.5px" onclick="toggleSignup()">'+(su?'Já tenho conta — Entrar':'Primeira vez? Criar acesso')+'</button>'+
      '</div>'+
      '<div class="w-help">'+(prof?'Sua senha é sua — ninguém mais vê.':'Entre com o e-mail e a senha que a professora te passou.')+'</div>'+
    '</div>'+
  '</div>';
}

/* ---------- shell ---------- */
const SCREENS={
  inicio:{full:true,f:scrInicio},
  login:{full:true,f:scrLogin},
  pending:{full:true,f:scrPending},
  p_home:{t:'Painel',nav:'prof',f:scrProfHome},
  p_turmas:{t:'Turmas',back:'p_home',f:scrTurmas},
  p_turma_form:{t:function(){return V.param?'Editar turma':'Nova turma';},back:'p_turmas',f:scrTurmaForm},
  p_alunas:{t:'Alunas',back:'p_home',f:scrAlunas},
  p_aluna_form:{t:function(){return V.param?'Editar aluna':'Nova aluna';},back:'p_alunas',f:scrAlunaForm},
  p_pagamentos:{t:'Pagamentos',nav:'prof',f:scrProfPagamentos},
  p_presenca:{t:'Presença',nav:'prof',f:scrPresenca},
  p_presenca_turma:{t:function(){var t=S.turmas.find(function(x){return x.id===V.param;});return t?t.nome:'Presença';},back:'p_presenca',f:scrPresencaTurma},
  p_avisos:{t:'Avisos',nav:'prof',f:scrAvisos},
  p_relatorios:{t:'Relatórios',nav:'prof',f:scrRelatorios},
  a_home:{t:function(){return 'Olá, '+curAluna().nome.split(' ')[0]+' 👋';},nav:'aluna',f:scrAlunaHome},
  a_agenda:{t:'Agenda',nav:'aluna',f:scrAgenda},
  a_avisos:{t:'Avisos',back:'a_home',f:scrAlunaAvisos},
  a_remarcar:{t:'Remarcar aula',back:'a_agenda',f:scrRemarcar},
  a_extra:{t:'Aula extra',back:'a_home',f:scrExtra},
  a_reposicao:{t:'Reposição',back:'a_home',f:scrReposicao},
  a_pagamentos:{t:'Pagamentos',nav:'aluna',f:scrPagamentos},
  a_recibo:{t:'Recibo',back:'a_pagamentos',f:scrRecibo},
  a_vagas:{t:'Vagas abertas',back:'a_agenda',f:scrVagas},
  a_perfil:{t:'Perfil',nav:'aluna',f:scrPerfil},
};
const NAV_PROF=[['p_home','🗂️','Painel'],['p_pagamentos','💳','Pagam.'],['p_presenca','✅','Presença'],['p_avisos','📣','Avisos'],['p_relatorios','📊','Relatórios']];
const NAV_ALUNA=[['a_home','🏠','Início'],['a_agenda','📅','Agenda'],['a_pagamentos','💳','Pagamentos'],['a_perfil','👤','Perfil']];
function bottomNav(kind){const items=kind==='prof'?NAV_PROF:NAV_ALUNA;return '<div class="d-nav">'+items.map(i=>'<button class="it'+(V.screen===i[0]?' active':'')+'" onclick="go(\''+i[0]+'\')"><span class="e">'+i[1]+'</span>'+i[2]+'</button>').join('')+'</div>';}
function render(){
  const sc=SCREENS[V.screen]||SCREENS.p_home;
  if(sc.full){document.getElementById('app').innerHTML=sc.f();return;}
  const title=typeof sc.t==='function'?sc.t():sc.t;
  let bell='';
  if(V.mode==='aluna'&&V.screen!=='a_avisos'){const n=avisosNaoLidos();bell='<button class="bell" onclick="abrirAvisos()">🔔'+(n>0?'<span class="badge">'+n+'</span>':'')+'</button>';}
  let h='<div class="d-appbar">'+(sc.back?'<button class="d-back" onclick="go(\''+sc.back+'\')">‹</button>':'')+'<div class="d-title">'+title+'</div>'+bell+'</div>';
  h+='<div class="d-content">'+sc.f()+'</div>';
  h+=sc.nav?bottomNav(sc.nav):'';
  document.getElementById('app').innerHTML=h;
}
var db,auth,authUser=null,sReady=false;
function emailOf(){return authUser?((authUser.email||'').toLowerCase()):'';}
function computeRole(){
  if(!S)return {mode:'anon'};
  var pe=((S.config&&S.config.professoraEmail)||'').toLowerCase();
  var email=emailOf();
  if(pe&&email===pe)return {mode:'prof'};
  var al=S.alunas.find(function(a){return (a.email||'').toLowerCase()===email;});
  if(al)return {mode:'aluna',alunaId:al.id};
  return {mode:'pending'};
}
function isLoginScreen(s){return s==='inicio'||s==='login';}
function isInputScreen(s){return s==='login'||s==='p_turma_form'||s==='p_aluna_form'||s==='p_avisos';}
function loading(){var el=document.getElementById('app');if(el)el.innerHTML='<div class="welcome"><div class="w-logo"><img src="'+LOGO+'" alt="Danda Reis"></div><div class="w-tag" style="margin-top:20px">Carregando…</div></div>';}
function route(){
  if(!sReady||!S){loading();return;}
  if(!authUser){if(isInputScreen(V.screen))return;if(!isLoginScreen(V.screen))V.screen='inicio';render();return;}
  var r=computeRole();
  if(r.mode==='pending'){V.mode='pending';V.screen='pending';render();return;}
  V.mode=r.mode;if(r.alunaId)V.alunaId=r.alunaId;
  if(isLoginScreen(V.screen)||V.screen==='pending'||!SCREENS[V.screen]||SCREENS[V.screen].full){V.screen=(r.mode==='prof'?'p_home':'a_home');render();return;}
  if(isInputScreen(V.screen))return;
  render();
}
function sair(){V={screen:'inicio',tmp:{},loginRole:null,signup:false};if(auth)auth.signOut();}
function logoutRow(){return '<div class="d-card d-row"><div class="d-grow"><div class="d-b" style="font-size:13px;word-break:break-all">'+esc(emailOf())+'</div><div class="d-s">Você está conectada</div></div><button class="d-cta ghost" style="width:auto;padding:10px 16px" onclick="sair()">Sair</button></div>';}
function scrPending(){return '<div class="welcome"><div class="w-logo"><img src="'+LOGO+'" alt="Danda Reis"></div><div class="w-name" style="font-size:22px">Quase lá!</div><div class="w-tag">Sua conta foi criada com<br><b>'+esc(emailOf())+'</b>.<br><br>Peça para a professora te cadastrar em <b>Alunas</b> usando esse mesmo e-mail. Depois é só entrar de novo. 💕</div><div class="w-btns"><button class="d-cta ghost" onclick="sair()">Sair</button></div></div>';}
function msgErr(e){var c=(e&&e.code)||'';if(c.indexOf('wrong-password')>=0||c.indexOf('invalid-credential')>=0||c.indexOf('invalid-login')>=0)return 'E-mail ou senha incorretos.';if(c.indexOf('user-not-found')>=0)return 'Conta não encontrada. Toque em "Criar acesso".';if(c.indexOf('email-already-in-use')>=0)return 'Este e-mail já tem conta. Toque em "Entrar".';if(c.indexOf('weak-password')>=0)return 'A senha precisa de 6 caracteres ou mais.';if(c.indexOf('invalid-email')>=0)return 'E-mail inválido.';if(c.indexOf('unauthorized-domain')>=0)return 'Falta liberar o link no Firebase: Authentication → Settings → Authorized domains → juhreismiranda3-blip.github.io';if(c.indexOf('operation-not-allowed')>=0||c.indexOf('configuration-not-found')>=0)return 'Ligue o login E-mail/senha no Firebase: Authentication → Sign-in method.';if(c.indexOf('network')>=0)return 'Sem conexão. Tente de novo.';if(c.indexOf('too-many-requests')>=0)return 'Muitas tentativas. Espere um pouquinho.';if(c.indexOf('api-key')>=0||c.indexOf('app-not-authorized')>=0)return 'Chave do Firebase não confere. Me avise.';return 'Não consegui: '+(c||'erro desconhecido');}
function boot(){
  try{firebase.initializeApp(FIREBASE_CONFIG);}catch(e){}
  db=firebase.firestore();auth=firebase.auth();
  auth.onAuthStateChanged(function(u){authUser=u;route();});
  db.collection('app').doc('estado').onSnapshot(function(snap){
    var data=snap.exists?snap.data():null;
    if(data&&data.turmas){S=data;sReady=true;}
    else if(!snap.metadata.hasPendingWrites){S=seed();sReady=true;save();}
    else{return;}
    if(isInputScreen(V.screen))return;
    route();
  },function(err){var el=document.getElementById('app');if(el)el.innerHTML='<div class="welcome"><div class="w-logo">⚠️</div><div class="w-tag" style="margin-top:16px">Não consegui abrir o banco de dados. Confira a internet e recarregue a página.</div></div>';});
}
window.onload=function(){V={screen:'inicio',tmp:{},loginRole:null,signup:false};loading();boot();};
</script>
